spring:
  application:
  name: prompt-be

  cron:
    key: ${CRON_JOB_KEY}

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  flyway:
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: profile, email
          provider:
            google:
              redirect-uri: ${REDIRECT_URI}
security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION}

server:
  servlet:
    context-path: /api/v1

korapay:
  payout: ${KORAPAY_PAYOUT_URL}
  checkout:
    url: ${KORAPAY_PAYIN_URL}
    notification_url: ${KORAPAY_ORDER_NOTIFICATION_URL}
    success_callback_url: ${KORAPAY_ORDER_SUCCESS_URL}
    deposit_success_callback_url: ${KORAPAY_DEPOSIT_SUCCESS_URL}
    deposit_notification_url: ${KORAPAY_DEPOSIT_NOTIFICATION_URL}
  api:
    key:
      secret: ${KORAPAY_API_SECRET}
      public: ${KORAPAY_API_PUBLIC_KEY}

application:
  oauth:
    redirect-url: ${OAUTH2_FRONTEND_REDIRECT_URL}
